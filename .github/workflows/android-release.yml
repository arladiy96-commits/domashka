name: Build and publish Домашка APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap native Android project
        run: |
          flutter create --org kz.domashka --project-name domashka --platforms android --no-pub .
          python3 scripts/configure_android.py
          rm -f test/widget_test.dart
      - name: Bundle local Russian-English OCR models
        run: python3 scripts/fetch_ocr_models.py
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release --build-name=0.1.${{ github.run_number }} --build-number=${{ github.run_number }}
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/domashka-v0.1.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: domashka-apk
          path: dist/*.apk
      - name: Publish in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Домашка v0.1.${{ github.run_number }}
          generate_release_notes: true
          files: dist/*.apk