name: Preview offline card OCR

on:
  pull_request:
    paths:
      - 'lib/screens.dart'
      - 'lib/offline_card_ocr.dart'
      - 'lib/paddle_card_ocr.dart'
      - 'lib/ocr_layout.dart'
      - 'scripts/fetch_paddle_models.py'
      - 'scripts/patch_paddle_plugin.py'
      - 'lib/ai_service.dart'
      - 'pubspec.yaml'
      - 'test/**'
      - 'scripts/fetch_ocr_models.py'
      - 'assets/tessdata_config.json'
      - '.github/workflows/ocr-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-ocr-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap Android project
        run: |
          flutter create --org kz.domashka --project-name domashka --platforms android --no-pub .
          DOMASHKA_PREVIEW=1 python3 scripts/configure_android.py
          rm -f test/widget_test.dart
      - name: Bundle Russian and English OCR models
        run: python3 scripts/fetch_ocr_models.py
      - name: Bundle PP-OCRv5 Cyrillic ONNX models
        run: |
          python3 -m pip install --user PyYAML
          python3 scripts/fetch_paddle_models.py
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Patch legacy OCR Gradle repositories
        run: python3 scripts/patch_tesseract_gradle.py
      - name: Patch PaddleOCR fatal Android dispose crash
        run: python3 scripts/patch_paddle_plugin.py
      - name: Run all tests
        run: flutter test
      - name: Build optimized Android ARM64 test APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Upload private test APK
        uses: actions/upload-artifact@v4
        with:
          name: domashka-paddle-ocr-v5-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
